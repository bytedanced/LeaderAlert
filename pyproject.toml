[project]
name = "leader-alert"
version = "0.3.0"
description = "牛来了预警系统：局域网人脸识别 + UDP 广播通知"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "PySide6~=6.6.3",
    "numpy<2",
    "opencv-python",
    "onnxruntime==1.20.1",
    "insightface",
]

[project.urls]
Repository = "https://github.com/bytedanced/LeaderAlert"

[dependency-groups]
dev = [
    "pyinstaller",
]
